<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام واتساب - Render</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #075e54, #128C7E); min-height: 100vh; padding: 15px; display: flex; justify-content: center; align-items: flex-start; }
        .container { background: white; border-radius: 25px; padding: 25px; max-width: 700px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin: 10px auto; }
        h1 { color: #075e54; text-align: center; font-size: 24px; margin-bottom: 5px; }
        .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 15px; }
        .note { background: #fff3cd; padding: 10px; border-radius: 10px; font-size: 13px; color: #856404; margin-bottom: 15px; border-right: 4px solid #ffc107; text-align: center; }
        .section { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .section-title { font-weight: bold; color: #075e54; margin-bottom: 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        label { display: block; font-weight: bold; color: #333; margin-bottom: 4px; font-size: 13px; }
        input, textarea, select { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; transition: 0.3s; outline: none; margin-bottom: 10px; }
        input:focus, textarea:focus, select:focus { border-color: #128C7E; box-shadow: 0 0 0 3px rgba(18,140,126,0.15); }
        textarea { resize: vertical; min-height: 70px; }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex-row .btn { flex: 1; min-width: 80px; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #075e54, #128C7E); color: white; }
        .btn-primary:hover:not(:disabled) { transform: scale(1.02); opacity: 0.9; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover:not(:disabled) { background: #218838; }
        .btn-outline { background: transparent; border: 2px solid #075e54; color: #075e54; }
        .btn-outline:hover { background: #075e54; color: white; }
        .btn-danger-outline { background: transparent; border: 2px solid #dc3545; color: #dc3545; }
        .btn-danger-outline:hover { background: #dc3545; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .messages-box { background: white; border: 2px solid #e0e0e0; border-radius: 12px; padding: 10px; max-height: 350px; overflow-y: auto; margin-top: 8px; }
        .msg-item { background: #f1f8f7; padding: 10px; border-radius: 10px; margin-bottom: 8px; border-right: 4px solid #128C7E; transition: 0.3s; }
        .msg-item:hover { background: #e8f5f2; }
        .msg-item .from { font-weight: bold; color: #075e54; font-size: 13px; }
        .msg-item .time { font-size: 11px; color: #999; float: left; }
        .msg-item .text { margin-top: 4px; color: #333; font-size: 14px; word-break: break-word; }
        .msg-item .reply-btn { margin-top: 6px; padding: 4px 12px; background: #075e54; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .msg-item .reply-btn:hover { background: #0a7a6a; }
        .msg-item .replied-badge { display: inline-block; background: #28a745; color: white; padding: 2px 10px; border-radius: 20px; font-size: 11px; margin-right: 5px; }
        .empty-msg { text-align: center; color: #999; padding: 20px; font-size: 14px; }
        #result { margin-top: 10px; padding: 10px; border-radius: 10px; display: none; text-align: center; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; display: block !important; }
        .error { background: #f8d7da; color: #721c24; display: block !important; }
        .loading { background: #cce5ff; color: #004085; display: block !important; }
        .footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 15px; }
        .counter { text-align: center; font-size: 13px; color: #dc3545; font-weight: bold; margin-top: 8px; }
        .badge-count { background: #075e54; color: white; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 5px; }
        .status-connected { background: #28a745; }
        .status-disconnected { background: #dc3545; }
        .msg-item.outgoing { border-right-color: #28a745; background: #e6f7ed; }
        @media (max-width: 500px) { .container { padding: 15px; } .flex-row .btn { min-width: 60px; font-size: 12px; padding: 8px 12px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 نظام المراسلة</h1>
        <p class="sub">إرسال • استقبال حقيقي • ردود</p>
        <div class="note">
            ⏳ الخطة المجانية: رسالة واحدة كل 60 ثانية
            <span style="float:left;font-size:12px;color:#333;">
                <span class="status-dot status-connected" id="statusDot"></span>
                <span id="statusText">متصل ✅</span>
            </span>
        </div>

        <!-- قسم الإرسال -->
        <div class="section">
            <div class="section-title">✉️ إرسال رسالة</div>
            <input type="text" id="phone" placeholder="رقم المستلم (مثال: 967770388100)" value="967770388100">
            <textarea id="msg" placeholder="اكتب رسالتك...">مرحباً! هذه رسالة من Render 🚀</textarea>
            <div class="flex-row">
                <button class="btn btn-primary" id="sendBtn">🚀 إرسال</button>
                <button class="btn btn-success" id="sendReplyBtn">↩️ رد على المحدد</button>
            </div>
            <input type="hidden" id="replyToId" value="">
            <small style="color:#888;font-size:12px;" id="replyHint">لم يتم تحديد رسالة للرد عليها</small>
            <div id="counterDisplay" class="counter"></div>
        </div>

        <!-- قسم القوائم -->
        <div class="section">
            <div class="section-title">📇 القوائم</div>
            <div class="flex-row">
                <button class="btn btn-outline" id="fetchContactsBtn">📋 جلب جهات الاتصال</button>
                <button class="btn btn-outline" id="fetchGroupsBtn">👥 جلب المجموعات</button>
            </div>
            <select id="listSelect" style="margin-top:8px;">
                <option value="">-- اختر جهة اتصال أو مجموعة --</option>
            </select>
            <small style="color:#888;font-size:12px;">اختر جهة وستظهر في حقل الرقم أعلاه</small>
        </div>

        <!-- قسم الرسائل الواردة -->
        <div class="section">
            <div class="section-title">
                <span>📥 الرسائل (من الخادوم)</span>
                <span class="badge-count" id="msgCount">0</span>
            </div>
            <div class="flex-row">
                <button class="btn btn-outline" id="refreshMessagesBtn">🔄 تحديث من الخادوم</button>
                <button class="btn btn-danger-outline" id="clearMessagesBtn">🗑️ مسح الكل</button>
            </div>
            <div id="messagesContainer" class="messages-box">
                <div class="empty-msg">⏳ جاري تحميل الرسائل من الخادوم...</div>
            </div>
        </div>

        <div id="result"></div>
        <div class="footer">WasenderAPI · يعرض الرسائل الحقيقية من messages.json</div>
    </div>

    <script>
        // =============================================================
        // التوكن الخاص بك
        // =============================================================
        const TOKEN = 'b750fdc9152f2462146603f298ff64dd2ef309598ab09e8f79442cab2192ea6f';

        // =============================================================
        // عناصر الواجهة
        // =============================================================
        const phoneInput = document.getElementById('phone');
        const msgInput = document.getElementById('msg');
        const sendBtn = document.getElementById('sendBtn');
        const sendReplyBtn = document.getElementById('sendReplyBtn');
        const replyToId = document.getElementById('replyToId');
        const replyHint = document.getElementById('replyHint');
        const resultDiv = document.getElementById('result');
        const messagesContainer = document.getElementById('messagesContainer');
        const listSelect = document.getElementById('listSelect');
        const counterDiv = document.getElementById('counterDisplay');
        const msgCountSpan = document.getElementById('msgCount');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // =============================================================
        // متغيرات الحالة
        // =============================================================
        let selectedReplyId = null;
        let selectedReplyFrom = null;
        let countdownInterval = null;
        let isCooldown = false;
        let refreshInterval = null;
        let allMessages = [];

        // =============================================================
        // دوال مساعدة
        // =============================================================
        function showResult(msg, type) {
            resultDiv.textContent = msg;
            resultDiv.className = type;
            if (type !== 'loading') {
                setTimeout(() => {
                    if (resultDiv.className === type) {
                        resultDiv.style.display = 'none';
                    }
                }, 5000);
            } else {
                resultDiv.style.display = 'block';
            }
        }

        function formatPhone(phone) {
            phone = phone.trim();
            if (!phone.includes('@')) {
                return phone + '@s.whatsapp.net';
            }
            return phone;
        }

        function startCooldown(seconds = 60) {
            if (isCooldown) return;
            isCooldown = true;
            sendBtn.disabled = true;
            sendReplyBtn.disabled = true;
            let remaining = seconds;

            counterDiv.textContent = `⏳ انتظر ${remaining} ثانية قبل الإرسال التالي...`;

            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    counterDiv.textContent = '';
                    sendBtn.disabled = false;
                    sendReplyBtn.disabled = false;
                    isCooldown = false;
                } else {
                    counterDiv.textContent = `⏳ انتظر ${remaining} ثانية قبل الإرسال التالي...`;
                }
            }, 1000);
        }

        // =============================================================
        // 1. جلب الرسائل من الخادوم (messages.json)
        // =============================================================
        async function fetchMessagesFromServer() {
            try {
                const response = await fetch('/messages.json?t=' + Date.now());
                if (!response.ok) {
                    if (response.status === 404) {
                        allMessages = [];
                        renderMessages();
                        return;
                    }
                    throw new Error('فشل جلب الملف');
                }
                const data = await response.json();
                if (Array.isArray(data)) {
                    allMessages = data;
                } else {
                    allMessages = [];
                }
                renderMessages();
            } catch (error) {
                console.error('خطأ في جلب الرسائل:', error);
                allMessages = [];
                renderMessages();
            }
        }

        // =============================================================
        // 2. عرض الرسائل
        // =============================================================
        function renderMessages() {
            msgCountSpan.textContent = allMessages.length;

            if (allMessages.length === 0) {
                messagesContainer.innerHTML = `<div class="empty-msg">📭 لا توجد رسائل مخزنة على الخادوم</div>`;
                return;
            }

            let html = '';
            allMessages.forEach(msg => {
                const from = msg.from || 'غير معروف';
                const text = msg.text || '📎 وسائط';
                const time = msg.time || '';
                const msgId = msg.id || '';
                const isReplied = msg.is_replied || false;

                // نعتبرها رسالة صادرة إذا كان الرقم يطابق رقمك
                const isOutgoing = from.includes('967770388100') || from.includes('you') || from.includes('أنت');
                const borderColor = isOutgoing ? '#28a745' : '#128C7E';
                const outgoingClass = isOutgoing ? 'outgoing' : '';

                html += `
                    <div class="msg-item ${outgoingClass}" style="border-right-color: ${borderColor};">
                        <div>
                            <span class="from">${isOutgoing ? '📤' : '📩'} ${from}</span>
                            <span class="time">${time}</span>
                            ${isReplied ? '<span class="replied-badge">✓ تم الرد</span>' : ''}
                        </div>
                        <div class="text">${text}</div>
                        ${!isOutgoing ? `<button class="reply-btn" onclick="setReply('${msgId}', '${from}')">↩️ رد</button>` : ''}
                    </div>
                `;
            });
            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // =============================================================
        // 3. إرسال رسالة (عادي أو رد) مباشرة إلى WasenderAPI
        // =============================================================
        async function sendMessage(to, text, replyTo = null) {
            const payload = { to, text };
            if (replyTo) payload.replyTo = replyTo;

            try {
                const response = await fetch('https://www.wasenderapi.com/api/send-message', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                return data;
            } catch (e) {
                return { success: false, message: 'فشل الاتصال بالـ API' };
            }
        }

        sendBtn.addEventListener('click', async () => {
            if (isCooldown || sendBtn.disabled) return;

            let phone = phoneInput.value.trim();
            const text = msgInput.value.trim();

            if (!phone) { showResult('⚠️ أدخل رقم الجوال', 'error'); return; }
            if (!text) { showResult('⚠️ اكتب الرسالة', 'error'); return; }

            phone = formatPhone(phone);
            phoneInput.value = phone;

            sendBtn.disabled = true;
            showResult('⏳ جاري الإرسال...', 'loading');

            const result = await sendMessage(phone, text);

            if (result.success) {
                showResult('✅ تم الإرسال بنجاح! 🎉', 'success');
                selectedReplyId = null;
                replyToId.value = '';
                replyHint.textContent = 'لم يتم تحديد رسالة للرد عليها';
                startCooldown(60);
                setTimeout(fetchMessagesFromServer, 2000);
            } else {
                if (result.retry_after) {
                    showResult(`⏳ حد مجاني: انتظر ${result.retry_after} ثانية`, 'error');
                    startCooldown(result.retry_after);
                } else {
                    showResult(`❌ ${result.message || 'فشل الإرسال'}`, 'error');
                    setTimeout(() => {
                        if (!isCooldown) sendBtn.disabled = false;
                    }, 5000);
                }
            }
            if (!isCooldown) sendBtn.disabled = false;
        });

        // =============================================================
        // 4. الرد على رسالة محددة
        // =============================================================
        sendReplyBtn.addEventListener('click', async () => {
            if (isCooldown || sendReplyBtn.disabled) return;

            if (!selectedReplyId) {
                showResult('⚠️ اختر رسالة أولاً بالضغط على "رد" بجانبها', 'error');
                return;
            }

            let phone = phoneInput.value.trim();
            const text = msgInput.value.trim();

            if (!phone) { showResult('⚠️ أدخل رقم الجوال', 'error'); return; }
            if (!text) { showResult('⚠️ اكتب نص الرد', 'error'); return; }

            phone = formatPhone(phone);
            phoneInput.value = phone;

            sendReplyBtn.disabled = true;
            showResult(`⏳ جاري الرد على ${selectedReplyFrom}...`, 'loading');

            const result = await sendMessage(phone, text, selectedReplyId);

            if (result.success) {
                showResult('✅ تم الرد بنجاح! 🎉', 'success');
                selectedReplyId = null;
                replyToId.value = '';
                replyHint.textContent = 'لم يتم تحديد رسالة للرد عليها';
                startCooldown(60);
                setTimeout(fetchMessagesFromServer, 2000);
            } else {
                if (result.retry_after) {
                    showResult(`⏳ حد مجاني: انتظر ${result.retry_after} ثانية`, 'error');
                    startCooldown(result.retry_after);
                } else {
                    showResult(`❌ ${result.message || 'فشل الرد'}`, 'error');
                }
            }
            if (!isCooldown) sendReplyBtn.disabled = false;
        });

        // =============================================================
        // 5. تحديد رسالة للرد عليها
        // =============================================================
        window.setReply = function(msgId, from) {
            selectedReplyId = msgId;
            selectedReplyFrom = from;
            replyToId.value = msgId;
            phoneInput.value = from;
            replyHint.textContent = `↩️ سترد على: ${from} (معرف: ${msgId.substring(0, 8)}...)`;
            showResult(`✅ تم تحديد الرسالة للرد عليها`, 'success');
        };

        // =============================================================
        // 6. جلب جهات الاتصال والمجموعات
        // =============================================================
        async function fetchContacts() {
            try {
                showResult('⏳ جاري جلب جهات الاتصال...', 'loading');
                const response = await fetch('https://www.wasenderapi.com/api/contacts', {
                    headers: { 'Authorization': 'Bearer ' + TOKEN }
                });
                const data = await response.json();
                if (data.success && data.data) {
                    const contacts = data.data;
                    listSelect.innerHTML = '<option value="">-- اختر جهة اتصال --</option>';
                    if (Array.isArray(contacts)) {
                        contacts.forEach(c => {
                            const opt = document.createElement('option');
                            opt.value = c.jid || c.id || c;
                            opt.textContent = c.name || c.jid || c;
                            listSelect.appendChild(opt);
                        });
                        showResult(`✅ تم جلب ${contacts.length} جهة اتصال`, 'success');
                    } else {
                        showResult('⚠️ لا توجد جهات اتصال', 'error');
                    }
                } else {
                    showResult(`⚠️ ${data.message || 'لا توجد جهات اتصال'}`, 'error');
                }
            } catch (e) {
                showResult('❌ فشل جلب جهات الاتصال: ' + e.message, 'error');
            }
        }

        async function fetchGroups() {
            try {
                showResult('⏳ جاري جلب المجموعات...', 'loading');
                const response = await fetch('https://www.wasenderapi.com/api/groups', {
                    headers: { 'Authorization': 'Bearer ' + TOKEN }
                });
                const data = await response.json();
                if (data.success && data.data) {
                    const groups = data.data;
                    listSelect.innerHTML = '<option value="">-- اختر مجموعة --</option>';
                    if (Array.isArray(groups)) {
                        groups.forEach(g => {
                            const opt = document.createElement('option');
                            opt.value = g.jid || g.id || g;
                            opt.textContent = g.subject || g.name || g.jid || g;
                            listSelect.appendChild(opt);
                        });
                        showResult(`✅ تم جلب ${groups.length} مجموعة`, 'success');
                    } else {
                        showResult('⚠️ لا توجد مجموعات', 'error');
                    }
                } else {
                    showResult(`⚠️ ${data.message || 'لا توجد مجموعات'}`, 'error');
                }
            } catch (e) {
                showResult('❌ فشل جلب المجموعات: ' + e.message, 'error');
            }
        }

        document.getElementById('fetchContactsBtn').addEventListener('click', fetchContacts);
        document.getElementById('fetchGroupsBtn').addEventListener('click', fetchGroups);

        listSelect.addEventListener('change', function() {
            if (this.value) {
                phoneInput.value = this.value;
                showResult(`✅ تم اختيار: ${this.options[this.selectedIndex].text}`, 'success');
            }
        });

        // =============================================================
        // 7. مسح الرسائل (حذف messages.json)
        // =============================================================
        document.getElementById('clearMessagesBtn').addEventListener('click', async function() {
            if (!confirm('⚠️ هل أنت متأكد من مسح جميع الرسائل المخزنة على الخادوم؟')) return;
            try {
                const response = await fetch('/clear_messages.php');
                const data = await response.json();
                if (data.success) {
                    showResult('🗑️ تم مسح جميع الرسائل من الخادوم', 'success');
                    fetchMessagesFromServer();
                } else {
                    showResult('⚠️ لم يتم العثور على clear_messages.php', 'error');
                }
            } catch (e) {
                showResult('⚠️ لم يتم العثور على clear_messages.php', 'error');
            }
        });

        // =============================================================
        // 8. تحديث يدوي
        // =============================================================
        document.getElementById('refreshMessagesBtn').addEventListener('click', function() {
            fetchMessagesFromServer();
            showResult('🔄 تم تحديث الرسائل من الخادوم', 'success');
        });

        // =============================================================
        // 9. تحميل أولي
        // =============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (phoneInput.value && !phoneInput.value.includes('@')) {
                phoneInput.value = phoneInput.value + '@s.whatsapp.net';
            }
            // جلب الرسائل من الخادوم أول مرة
            fetchMessagesFromServer();
            // تحديث تلقائي كل 15 ثانية
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(fetchMessagesFromServer, 15000);
        });

        console.log('🚀 نظام واتساب - Render (يعرض messages.json) جاهز!');
        console.log('📌 يتم جلب الرسائل من الخادوم كل 15 ثانية.');
        console.log('✅ حالة الجلسة: متصلة (نظراً لأن الإرسال يعمل)');
    </script>
</body>
</html>
